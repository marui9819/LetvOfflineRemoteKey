plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marui.letvremoteoffline'
    compileSdk 34

    defaultConfig {
        applicationId 'com.marui.letvremoteoffline'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '1.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
